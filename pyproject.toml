[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attendiq-noshows"
version = "0.1.0"
description = "Appointment no-show prediction course project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.6.0",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
include = ["noshows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
